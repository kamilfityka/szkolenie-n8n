# =============================================================================
# n8n SINGLE — jedna instancja n8n dla wielu użytkowników, za nginx-proxy-manager
# =============================================================================
# Jedna instancja n8n z wbudowanym zarządzaniem użytkownikami (owner zaprasza
# kolejne osoby). SSL robi nginx-proxy-manager z przodu — n8n słucha po HTTP
# wewnątrz sieci Dockera i nie publikuje portów na zewnątrz.
#
# Uruchomienie:
#   1. cp .env.single.example .env.single   (uzupełnij hasła, klucz, domenę)
#   2. docker compose -f docker-compose.single.yaml --env-file .env.single up -d
#   3. W nginx-proxy-manager utwórz Proxy Host (patrz SINGLE.md)
# =============================================================================

name: n8n-single

volumes:
  n8n_single_data:
  n8n_single_db:

networks:
  # Sieć nginx-proxy-manager — MUSI już istnieć (tworzy ją stack NPM).
  # Sprawdź nazwę:  docker network ls | grep nginx
  nginx-proxy-manager_default:
    external: true
  # Wewnętrzna sieć n8n <-> postgres (niewidoczna dla NPM/świata)
  internal:

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - n8n_single_db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-n8n}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-single
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Baza danych ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-}
      # --- Adres publiczny (SSL kończy się na nginx-proxy-manager) ---
      N8N_HOST: ${N8N_HOST:-}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_HOST:-}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST:-}/
      N8N_SECURE_COOKIE: "true"
      # --- Zarządzanie użytkownikami ---
      # Pierwsza osoba, która wejdzie na URL i założy konto, zostaje Ownerem.
      # Owner zaprasza kolejnych użytkowników w Settings → Users.
      # (Opcjonalny SMTP poniżej pozwala wysyłać zaproszenia e-mailem.)
      # --- Szyfrowanie i różne ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Warsaw}
      TZ: ${GENERIC_TIMEZONE:-Europe/Warsaw}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # --- SMTP (opcjonalnie — do zapraszania użytkowników e-mailem) ---
      # Odkomentuj i uzupełnij w .env.single, żeby n8n wysyłał zaproszenia:
      N8N_EMAIL_MODE: ${N8N_EMAIL_MODE:-}
      N8N_SMTP_HOST: ${N8N_SMTP_HOST:-}
      N8N_SMTP_PORT: ${N8N_SMTP_PORT:-}
      N8N_SMTP_USER: ${N8N_SMTP_USER:-}
      N8N_SMTP_PASS: ${N8N_SMTP_PASS:-}
      N8N_SMTP_SENDER: ${N8N_SMTP_SENDER:-}
      N8N_SMTP_SSL: ${N8N_SMTP_SSL:-}
    volumes:
      - n8n_single_data:/home/node/.n8n
    # Bez `ports:` — dostęp z zewnątrz idzie wyłącznie przez nginx-proxy-manager.
    expose:
      - "5678"
    networks:
      - internal
      - nginx-proxy-manager_default
