# =============================================================================
# n8n FLEET — infrastruktura bazowa (PostgreSQL)
# =============================================================================
# Frontem jest nginx-proxy-manager, który stoi w swojej własnej sieci docker.
# Dokładamy się do tej sieci jako zewnętrznej — NPM kieruje ruch po nazwie
# domeny wprost do kontenera uczestnika:
#
#   user1.<BASE_DOMAIN>  ->  n8n-user1:5678
#
# Instancje n8n są dodawane dynamicznie jako osobne pliki w instances/<nazwa>.yaml
# (patrz add-instance.sh). Żaden kontener nie publikuje portu na hosta —
# port 5678 jest tylko wystawiony (expose) wewnątrz sieci.
#
# Uruchomienie ręczne (zwykle wołane przez skrypty):
#   docker compose -p n8n-fleet \
#     --env-file .env.dynamic --env-file .env.instances \
#     -f docker-compose.dynamic.yaml -f instances/user1.yaml ... up -d
# =============================================================================

name: n8n-fleet

volumes:
  db_storage:

networks:
  # Prywatna sieć floty: tylko n8n <-> PostgreSQL. Baza nie jest widoczna
  # dla pozostałych kontenerów wpiętych w sieć nginx-proxy-managera.
  internal:
    name: n8n-fleet-internal

  # Sieć nginx-proxy-managera — tworzy ją compose NPM-a, my tylko dołączamy.
  # Nazwa do zmiany w .env.dynamic:  NPM_NETWORK=...
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy-manager_default}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — jedna instancja bazy, osobna baza danych per instancja n8n
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: postgres
    volumes:
      - db_storage:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
