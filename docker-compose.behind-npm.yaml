# =============================================================================
# Override: frontem jest nginx-proxy-manager (NPM), Traefik wyłączony
# =============================================================================
# Użyj, gdy na serwerze stoi już nginx-proxy-manager na portach 80/443 i to ON
# ma rozdzielać ruch. Wtedy:
#
#   Internet → NPM (80/443, SSL per subdomena) → n8n-user1:5678   (kontener 1)
#                                              → n8n-user2:5678   (kontener 2)
#                                              → ...
#
#   - każda subdomena ma SWÓJ kontener, a NPM trafia do niego po nazwie
#     kontenera we wspólnej sieci docker `n8n-fleet`,
#   - kontenery n8n NIE wystawiają żadnego portu na hosta — jedyne wejście
#     z internetu prowadzi przez NPM,
#   - Traefik w ogóle nie startuje (profil `disabled`), więc nie walczy z NPM
#     o porty 80/443 ani nie dokłada drugiego proxy na trasie.
#
# Włączenie trybu (na stałe): USE_BEHIND_NPM=1 w .env.dynamic
# Włączenie jednorazowe:      USE_BEHIND_NPM=1 bash add-instance.sh user1
#
# Konfiguracja hostów w NPM (ręcznie lub skryptem npm-hosts.sh):
#   Domain Names:          userN.<BASE_DOMAIN>
#   Forward Hostname / IP: n8n-userN        Forward Port: 5678
#   Websockets Support:    ON  (n8n bez tego nie działa poprawnie)
#   SSL:                   Let's Encrypt + Force SSL
#
# Warunek: kontener NPM musi być w sieci `n8n-fleet` — skrypty podłączają go
# automatycznie (patrz ensure_npm_network w _lib.sh).
# =============================================================================

services:
  traefik:
    # Profil, którego nikt nie włącza => usługa nigdy nie wystartuje.
    profiles:
      - disabled
    ports: !override []
