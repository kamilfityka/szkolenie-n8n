events {
    worker_connections 1024;
}

http {
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Docker's internal DNS — rozwiązuje nazwy kontenerów per-request, nie przy starcie nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # Wszystkie 22 instancji na jednym porcie 443 — routing po ścieżce
    server {
        listen 443 ssl;

        location /01/ { set $up http://n8n-01:5678; proxy_pass $up; }
        location /02/ { set $up http://n8n-02:5678; proxy_pass $up; }
        location /03/ { set $up http://n8n-03:5678; proxy_pass $up; }
        location /04/ { set $up http://n8n-04:5678; proxy_pass $up; }
        location /05/ { set $up http://n8n-05:5678; proxy_pass $up; }
        location /06/ { set $up http://n8n-06:5678; proxy_pass $up; }
        location /07/ { set $up http://n8n-07:5678; proxy_pass $up; }
        location /08/ { set $up http://n8n-08:5678; proxy_pass $up; }
        location /09/ { set $up http://n8n-09:5678; proxy_pass $up; }
        location /10/ { set $up http://n8n-10:5678; proxy_pass $up; }
        location /11/ { set $up http://n8n-11:5678; proxy_pass $up; }
        location /12/ { set $up http://n8n-12:5678; proxy_pass $up; }
        location /13/ { set $up http://n8n-13:5678; proxy_pass $up; }
        location /14/ { set $up http://n8n-14:5678; proxy_pass $up; }
        location /15/ { set $up http://n8n-15:5678; proxy_pass $up; }
        location /16/ { set $up http://n8n-16:5678; proxy_pass $up; }
        location /17/ { set $up http://n8n-17:5678; proxy_pass $up; }
        location /18/ { set $up http://n8n-18:5678; proxy_pass $up; }
        location /19/ { set $up http://n8n-19:5678; proxy_pass $up; }
        location /20/ { set $up http://n8n-20:5678; proxy_pass $up; }
        location /21/ { set $up http://n8n-21:5678; proxy_pass $up; }
        location /22/ { set $up http://n8n-22:5678; proxy_pass $up; }
    }
}
