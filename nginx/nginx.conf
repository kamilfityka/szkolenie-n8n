events {
    worker_connections 1024;
}

http {
    # SSL — wspólny self-signed certyfikat dla wszystkich instancji
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # WebSocket + proxy headers (wymagane przez n8n)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    # Uczestnik 01 — https://IP:9001
    server {
        listen 9001 ssl;
        location / { proxy_pass http://n8n-01:5678; }
    }

    # Uczestnik 02 — https://IP:9002
    server {
        listen 9002 ssl;
        location / { proxy_pass http://n8n-02:5678; }
    }

